<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Title Generator</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Summary Title Generator</h1>
            <p class="subtitle">Generate 4 compelling titles for your 1000-word summaries</p>
        </header>

        <div class="input-section">
            <h2>Add New Summary</h2>

            <div class="form-group">
                <label for="summary-input">Summary Content (1000 words)</label>
                <textarea
                    id="summary-input"
                    placeholder="Paste your 1000-word summary here..."
                    rows="10"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="custom-instructions">Custom Instructions (Optional)</label>
                <textarea
                    id="custom-instructions"
                    placeholder="e.g., Exclude executive names, Focus on revenue metrics, Avoid technical jargon..."
                    rows="3"
                ></textarea>
                <small class="help-text">Specify any requirements for title generation, such as excluding executive names or focusing on specific aspects.</small>
            </div>

            <button id="submit-btn" class="primary-btn" onclick="saveSummary()">
                Save Summary
            </button>
        </div>

        <div class="summaries-section">
            <h2>Saved Summaries</h2>
            <div id="summaries-list"></div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
